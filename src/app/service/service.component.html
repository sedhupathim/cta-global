<div class="row">
  <div class="col-md-4 col-sm-6 col-xs-1" *ngFor="let category of categories.slice(0, 4)">
    <div class="swipe-container cursor" (click)="goToServiceCategory(category?.slug)">
        <div class="swipe-card">
            <img class="swiperImage" src="{{category?.image}}" [alt]="category?.image">
              <img alt="Product Image" class="no-product-image" *ngIf="!category.image"
                            src="assets/no-products-found.png">
            <h4 class="swipe-header">
                {{category?.cate_name}}
            </h4>
            <p class="swipe-desc">
              {{category?.description}}
            </p>
        </div>
    </div>
    </div>
    </div>
